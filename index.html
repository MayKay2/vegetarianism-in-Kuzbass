38 \u0441 \u043e\u0442\u043a\u0430\u0437\u043e\u043c \u043e\u0442 \u043b\u044e\u0431\u043e\u0439 \u044d\u043a\u0441\u043f\u043b\u0443\u0430\u0442\u0430\u0446\u0438\u0438 \u0436\u0438\u0432\u043e\u0442\u043d\u044b\u0445<\/span><\/p>\", \"image\": \"media\/5861\/images\/32512\/lvfeBYRXsMchc3hYE9knrXymSBzmmfIE8XUJa2ZD.jpg\", \"title\": \"\u0412\u0435\u0433\u0430\u043d\u0441\u0442\u0432\u043e\"}, {\"id\": \"<p><span>\u043f\u043e\u0434\u0432\u0438\u0434 \u0432\u0435\u0433\u0430\u043d\u0441\u0442\u0432\u0430, \u043f\u0440\u0438 \u043a\u043e\u0442\u043e\u0440\u043e\u043c \u0438\u0441\u043a\u043b\u044e\u0447\u0430\u0435\u0442\u0441\u044f \u043b\u044e\u0431\u0430\u044f \u043f\u0438\u0449\u0430, \u043f\u0440\u0438\u0433\u043e\u0442\u043e\u0432\u043b\u0435\u043d\u043d\u0430\u044f \u043f\u0440\u0438 \u0442\u0435\u043c\u043f\u0435\u0440\u0430\u0442\u0443\u0440\u0435 \u0432\u044b\u0448\u0435 48\u00b0C<\/span><\/p>\", \"text\": \"<p><span>\u043f\u043e\u0434\u0432\u0438\u0434 \u0432\u0435\u0433\u0430\u043d\u0441\u0442\u0432\u0430, \u043f\u0440\u0438 \u043a\u043e\u0442\u043e\u0440\u043e\u043c \u0438\u0441\u043a\u043b\u044e\u0447\u0430\u0435\u0442\u0441\u044f \u043b\u044e\u0431\u0430\u044f \u043f\u0438\u0449\u0430, \u043f\u0440\u0438\u0433\u043e\u0442\u043e\u0432\u043b\u0435\u043d\u043d\u0430\u044f \u043f\u0440\u0438 \u0442\u0435\u043c\u043f\u0435\u0440\u0430\u0442\u0443\u0440\u0435 \u0432\u044b\u0448\u0435 48\u00b0C<\/span><\/p>\", \"image\": \"media\/5861\/images\/32512\/7eSuIAtpgsCIrW9BzDOJITcjNZ4dtj4jA2QUyUvX.jpg\", \"title\": \"\u0421\u044b\u0440\u043e\u0435\u0434\u0435\u043d\u0438\u0435\"}, {\"id\": \"<p><span>\u043f\u0438\u0442\u0430\u043d\u0438\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u043b\u043e\u0434\u0430\u043c\u0438, \u043e\u0440\u0435\u0445\u0430\u043c\u0438 \u0438 \u0441\u0435\u043c\u0435\u043d\u0430\u043c\u0438, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0440\u0430\u0441\u0442\u0435\u043d\u0438\u0435 \u043c\u043e\u0436\u0435\u0442 \u0432\u043e\u0441\u043f\u0 s\/32512\/DG6spQ9QF6MN06H2QW9gIz5g4jsbjAQlvNBQTGJz.jpg\", \"title\": \"\u0414\u0436\u0443\u0441\u0438\u0430\u0440\u0438\u0430\u043d\u0441\u0442\u0432\u043e\"}, {\"id\": \"<p>\u0438\u0441\u043a\u043b\u044e\u0447\u0430\u0435\u0442\u0441\u044f \u043c\u044f\u0441\u043e \u0436\u0438\u0432\u043e\u0442\u043d\u044b\u0445 \u0438 \u043f\u0442\u0438\u0446\u044b, \u043d\u043e \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f \u0440\u044b\u0431\u0430, \u043c\u043e\u0440\u0435\u043f\u0440\u043e\u0434\u0443\u043a\u0442\u044b, \u044f\u0439\u0446\u0430 \u0438 \u043c\u043e\u043b\u043e\u0447\u043d\u044b\u0435 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u044b<\/p>\", \"text\": \"<p>\u0438\u0441\u043a\u043b\u044e\u0447\u0430\u0435\u0442\u0441\u044f \u043c\u044f\u0441\u043e \u0436\u0438\u0432\u043e\u0442\u043d\u044b\u0445 \u0438 \u043f\u0442\u0438\u0446\u044b, \u043d\u043e \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f \u0440\u044b\u0431\u0430, \u043c\u043e\u0440\u0435\u043f\u0440\u043e\u0434\u0443\u043a\u0442\u044b, \u044f\u0439\u0446\u0430 \u0438 \u043c\u043e\u043b\u043e\u0447\u043d\u044b\u0435 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u044b<\/p>\", \"image\": \"media\/5861\/images\/32512\/shQahRaiFaVkEkuLrxN0AdWNA8ww5VRrxXKMYi9v.jpg\", \"title\": \"\u041f\u0435\u0441\u043a\u0435\u0442\u0430\u0440\u0438\u0430\u043d\u0441\u0442\u0432\u043e\"}, {\"id\": \"<p><span>\u0438\u0441\u043a\u043b\u044e\u0447\u0430\u0435\u0442\u0441\u044f \u043a\u0440\u0430\u0441\u043d\u043e\u0435 \u043c\u044f\u0441\u043e \u0438 \u0440\u044b\u0431\u0430, \u043d\u043e \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f \u043c\u044f\u0441\u043e \u043f\u0442\u0438\u0446\u044b, \u044f\u0439\u0446\u0430 \u0438 \u043c\u043e\u043b\u043e\u0447\u043d\u044b\u0435 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u044b<\/span><\/p>\", \"text\": \"<p><span>\u0438\u0441\u043a\u043b\u044e\u0447\u0430\u0435\u0442\u0441\u044f \u043a\u0440\u0430\u0441\u043d\u043e\u0435 \u043c\u044f\u04 43e\u0442\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0438\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u044e\u0442\u0441\u044f \u0440\u0435\u0434\u043a\u043e \u0438\u043b\u0438 \u0432 \u043d\u0435\u0431\u043e\u043b\u044c\u0448\u0438\u0445 \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u0430\u0445<\/span><\/p>\", \"text\": \"<p><span>\u0433\u0438\u0431\u043a\u0438\u0439 \u043f\u043e\u0434\u0445\u043e\u0434, \u043c\u044f\u0441\u043e \u0438 \u0434\u0440\u0443\u0433\u0438\u0435 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u044b \u0436\u0438\u0432\u043e\u0442\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0438\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u044e\u0442\u0441\u044f \u0440\u0435\u0434\u043a\u043e \u0438\u043b\u0438 \u0432 \u043d\u0435\u0431\u043e\u043b\u044c\u0448\u0438\u0445 \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u0430\u0445<\/span><\/p>\", \"image\": \"media\/5861\/images\/32512\/VLBK2CuKSzkTeqoVdSwi9eiIbRHa57LecyXZnfv6.jpg\", \"title\": \"\u0424\u043b\u0435\u043a\u0441\u0438\u0442\u0430\u0440\u0438\u0430\u043d\u0441\u0442\u0432\u043e\"}, {\"id\": \"<p><span>\u043f\u0440\u0435\u0438\u043c\u0443\u0449\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e \u0438\u0441\u043a\u043b\u044e\u0447\u0430\u044e\u0442\u0441\u044f \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u044b \u0436\u0438\u0432\u043e\u0442\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0438\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f. \u041e\u0441\u043d\u043e\u0432\u0430 \u2014 \u0446\u0435\u043b\u044c\u043d\u044b\u0435 \u0437\u0451\u0440\u043d\u0430, \u043e\u0432\u043e\u0449\u0438, \u0431\u043e\u0431\u043e\u0432\u044b\u0435, \u043c\u043e\u0440\u0441\u043a\u0438\u0435 \u0432\u043e\u0434\u043e\u0440\u043e\u0441\u043b\u0438. \u0414\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f \u043d\u0435\u0431\u043e\u043b\u044c\u0448\u043e\u0435 \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e \u0440\u044b\u0431\u044b<\/span><\/p>\", \"text\": \"<p><span>\u043f\u0440\u0435\u0438\u043c\u0443\u0449\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e \u0438\u0441\u043a\u043b\u044e\u0447\u0430\u044e\u0442\u0441\u044f \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u044b \u0436\u0438\u0432\u043e\u0442\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0438\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f. \u041e\u0441\u043d\u043e\u0432\u0430 \u2014 \u0446\u0435\u043b\u044c\u043d\u044b\u0435 \u0437\u0451\u0440\u043d\u0430, \u043e\u0432\u043e\u0449\u0438, \u0431\u043e\u0431\u043e\u0432\u044b\u0435, \u043c\u043e\u0440\u0441\u043a\u0438\u0435 \u0432\u043e\u0434\u043e\u0440\u043e\u0441\u043b\u0438. \u0414\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f \u043d\u0435\u0431\u043e\u043b\u044c\u0448\u043e\u0435 \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e \u0440\u044b\u0431\u044b<\/span><\/p>\", \"image\": \"media\/5861\/images\/32512\/Mt198mXjQKbPOugY7WvOQOcHfdmCj6OIimTGG1xd.jpg\", \"title\": \"\u041c\u0430\u043a\u0440\u043e\u0431\u0438\u043e\u0442\u0438\u043a\u0430\"}, {\"id\": \"<p><span>\u044d\u0442\u043e \u0438\u0434\u0435\u043e\u043b\u043e\u0433\u0438\u044f, \u0430 \u043d\u0435 \u043f\u0440\u043e\u0441\u0442\u043e \u0434\u0438\u0435\u0442\u0430. \u041e\u0442\u043a\u0430\u0437 \u043e\u0442 \u0443\u0447\u0430\u0441\u0442\u0438\u044f \u0432 \u043f\u043e\u0442\u0440\u0435\u0431\u0438\u0442\u0435\u043b\u044c\u0441\u043a\u043e\u0439 \u044d\u043a\u043e\u043d\u043e\u043c\u0438\u043a\u0435. \u041f\u0440\u043e\u0434\u0443\u043a\u0442\u044b \u0431\u0435\u0440\u0443\u0442\u0441\u044f \u0432\u044b\u0431\u0440\u043e\u0448\u0435\u043d\u043d\u044b\u0435, \u043d\u043e \u043f\u0440\u0438\u0433\u043e\u0434\u043d\u044b\u0435 \u0432 \u043f\u0438\u0449\u0443. \u0424\u0440\u0438\u0433\u0430\u043d\u044b \u043c\u043e\u0433\u0443\u0442 \u0435\u0441\u0442\u044c \u043c\u044f\u0441\u043e, \u0435\u0441\u043b\u0438 \u043e\u043d\u043e \u043d\u0435 \u0431\u044b\u043b\u043e \u0441\u043f\u0435\u0446\u0438\u0430\u043b\u044c\u043d\u043e \u043a\u0443\u043f\u043b\u0435\u043d\u043e<\/span><\/p>\", \"text\": \"<p><span>\u044d\u0442\u043e \u0438\u0434\u0435\u043e\u043b\u043e\u0433\u0438\u044f, \u0430 \u043d\u0435 \u043f\u0440\u043e\u0441\u0442\u043e \u0434\u0438\u0435\u0442\u0430. \u041e\u0442\u043a\u0430\u0437 \u043e\u0442 \u0443\u0447\u0430\u0441\u0442\u0438\u044f \u0432 \u043f\u043e\u0442\u0440\u0435\u0431\u0438\u0442\u0435\u043b\u044c\u0441\u043a\u043e\u0439 \u044d\u043a\u043e\u043d\u043e\u043c\u0438\u043a\u0435. \u041f\u0440\u043e\u0434\u0443\u043a\u0442\u044b \u0431\u0435\u0440\u0443\u0442\u0441\u044f \u0432\u044b\u0431\u0440\u043e\u0448\u0435\u043d\u043d\u044b\u0435, \u043d\u043e \u043f\u0440\u0438\u0433\u043e\u0434\u043d\u044b\u0435 \u0432 \u043f\u0438\u0449\u0443. \u0424\u0440\u0438\u0433\u0430\u043d\u044b \u043c\u043e\u0433\u0443\u0442 \u0435\u0441\u0442\u044c \u043c\u044f\u0441\u043e, \u0435\u0441\u043b\u0438 \u043e\u043d\u043e \u043d\u0435 \u0431\u044b\u043b\u043e \u0441\u043f\u0435\u0446\u0438\u0430\u043b\u044c\u043d\u043e \u043a\u0443\u043f\u043b\u0435\u043d\u043e<\/span><\/p>\", \"image\": \"media\/5861\/images\/32512\/rN4pJMbEWlvtgiqDYvR2j2QVEJyYMrV6DYkOSiZ2.jpg\", \"title\": \"\u0424\u0440\u0438\u0433\u0430\u043d\u0438\u0437\u043c\"}], \"hint\": \"\u041d\u0430\u0436\u043c\u0438\u0442\u0435 \u043d\u0430 \u043a\u0430\u0436\u0434\u0443\u044e \u0432\u043a\u043b\u0430\u0434\u043a\u0443 \u0434\u043b\u044f \u0438\u0437\u0443\u0447\u0435\u043d\u0438\u044f \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u043d\u0438\u044f\", \"type\": \"tabs\", \"uuid\": \"038ad3f6-b71a-4353-8b36-ee841c73af07\", \"version\": \"1.0.0\", \"disabled\": false, \"background\": {\"type\": \"color\", \"style\": \"background-color: #FFFFFF;\", \"value\": \"#FFFFFF\"}}, {\"body\": {\"title\": \"<p>\u0412 \u043c\u0438\u0440\u0435 \u043e\u043a\u043e\u043b\u043e 1,5 \u043c\u0438\u043b\u043b\u0438\u0430\u0440\u0434\u0430 \u0432\u0435\u0433\u0435\u0442\u0430\u0440\u0438\u0430\u043d\u0446\u0435\u0432<\/p><p>\u042d\u0442\u043e \u043e\u043a\u043e\u043b\u043e 22% \u043d\u0430\u0441\u0435\u043b\u0435\u043d\u0438\u044f \u043f\u043b\u0430\u043d\u0435\u0442\u044b <\/p>\", \"subtitle\": \"<p>\u0412\u0430\u0436\u043d\u043e: \u0432 \u044d\u0442\u0443 \u0446\u0438\u0444\u0440\u0443 \u0432\u0445\u043e\u0434\u044f\u0442 \u0438 \u0442\u0435, \u043a\u0442\u043e \u043e\u0442\u043a\u0430\u0437\u0430\u043b\u0441\u044f \u043e\u0442 \u043c\u044f\u0441\u0430 <strong>\u043f\u043e \u0440\u0435\u043b\u0438\u0433\u0438\u043e\u0437\u043d\u044b\u043c, \u044d\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u0438\u043b\u0438 \u0444\u0438\u0437\u0438\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u043f\u0440\u0438\u0447\u0438\u043d\u0430\u043c<\/strong>, \u0438 \u0442\u0435, \u0443 \u043a\u043e\u0433\u043e <strong>\u043d\u0435\u0442 \u0430\u043b\u044c\u0442\u0435\u0440\u043d\u0430\u0442\u0438\u0432\u044b<\/strong>, \u0432\u0435\u0434\u044c \u0432 \u043d\u0435\u043a\u043e\u0442\u043e\u0440\u044b\u0445 \u043c\u0435\u0441\u0442\u0430\u0445 \u043b\u044e\u0434\u0438 \u0438\u043c\u0435\u044e\u0442 \u043c\u0435\u043d\u044c\u0448\u0435 \u0434\u043e\u0441\u0442\u0443\u043f\u0430 \u043a\u0430\u043a \u043c\u044f\u0441\u0443, \u0442\u0430\u043a \u0438 \u043a \u0434\u0440\u0443\u0433\u0438\u043c \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u0430\u043c.<\/p><p><\/p><p>\u041f\u0440\u0438 \u044d\u0442\u043e\u043c <strong>\u00ab\u0447\u0438\u0441\u0442\u044b\u0445\u00bb \u0432\u0435\u0433\u0435\u0442\u0430\u0440\u0438\u0430\u043d\u0446\u0435\u0432<\/strong>, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0432\u044b\u0431\u0440\u0430\u043b\u0438 \u044d\u0442\u043e \u043f\u0438\u0442\u0430\u043d\u0438\u0435 \u043e\u0441\u043e\u0437\u043d\u0430\u043d\u043d\u043e, \u043e\u0446\u0435\u043d\u0438\u0432\u0430\u044e\u0442 \u043f\u0440\u0438\u043c\u0435\u0440\u043d\u043e \u0432 <strong>75 \u043c\u0438\u043b\u043b\u0438\u043e\u043d\u043e\u0432<\/strong 5\u0442 \u0437\u0430\u043a\u0440\u044b\u0442\u044c \u043f\u043e\u0442\u0440\u0435\u0431\u043d\u043e\u0441\u0442\u0438, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u043f\u0440\u0438 \u043e\u0442\u043a\u0430\u0437\u0435 \u043e\u0442 \u043c\u043e\u043b\u043e\u0447\u043d\u044b\u0445 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u043e\u0432 \u0438\u043d\u043e\u0433\u0434\u0430 \u0441\u043b\u043e\u0436\u043d\u043e \u0437\u0430\u043a\u0440\u044b\u0442\u044c.<\/p><p>\u041d\u043e \u0442\u0443\u0442 \u0442\u043e\u0436\u0435 \u0435\u0441\u0442\u044c \u043c\u0430\u0440\u043a\u0435\u0442\u0438\u043d\u0433\u043e\u0432\u044b\u0439 \u043f\u043e\u0434\u0442\u0435\u043a\u0441\u0442. \u0427\u0430\u0441\u0442\u043e \u043d\u0430 \u0443\u043f\u0430\u043a\u043e\u0432\u043a\u0430\u0445 \u0434\u0435\u043b\u0430\u044e\u0442 \u0430\u043a\u0446\u0435\u043d\u0442 \u043d\u0430 \u00ab\u043d\u0430\u0442\u0443\u0440\u0430\u043b\u044c\u043d\u043e\u0441\u0442\u0438\u00bb \u0438\u043b\u0438 \u00ab\u043f\u043e\u043b\u044c\u0437\u0435 \u0434\u043b\u044f \u043f\u043e\u0445\u0443\u0434\u0435\u043d\u0438\u044f\u00bb, \u0445\u043e\u0442\u044f \u043f\u043e \u0444\u0430\u043a\u0442\u0443 \u043c\u043d\u043e\u0433\u0438\u0435 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u044b \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0442 \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043d\u044b\u0439 <strong>\u0441\u0430\u0445\u0430\u0440, \u0441\u0442\u0430\u0431\u0438\u043b\u0438\u0437\u0430\u0442\u043e\u0440\u044b<\/strong> \u0438\u043b\u0438 \u0434\u0440\u0443\u0433\u0438\u0435 \u0438\u043d\u0433\u0440\u0435\u0434\u0438\u0435\u043d\u0442\u044b, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0441\u043d\u0438\u0436\u0430\u044e\u0442 \u0438\u0445 \u0434\u0438\u0435\u0442\u0438\u0447\u0435\u0441\u043a\u0443\u044e \u0446\u0435\u043d\u043d\u043e\u0441\u0442\u044c. <strong>\u041f\u043e\u044d\u0442\u043e\u043c\u0443 \u0432\u0430\u0436\u043d\u043e \u0447\u0438\u0442\u0430\u0442\u044c \u0441\u043e\u0441\u0442\u0430\u0432\\\"<\/strong> 48\u0430\u043d\u043d\u043e\u0435 \u043f\u0438\u0442\u0430\u043d\u0438\u0435 \u0441 \u0431\u043e\u043b\u044c\u0448\u0438\u043c \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e\u043c \u043e\u0432\u043e\u0449\u0435\u0439, \u0444\u0440\u0443\u043a\u0442\u043e\u0432, \u0446\u0435\u043b\u044c\u043d\u043e\u0437\u0435\u0440\u043d\u043e\u0432\u044b\u0445 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u043e\u0432 \u0438 \u0443\u043c\u0435\u0440\u0435\u043d\u043d\u044b\u043c \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e\u043c \u0436\u0438\u0432\u043e\u0442\u043d\u043e\u0433\u043e \u0431\u0435\u043b\u043a\u0430 \u0447\u0430\u0441\u0442\u043e \u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0441\u0430\u043c\u044b\u043c \u043d\u0430\u0434\u0451\u0436\u043d\u044b\u043c \u0432\u044b\u0431\u043e\u0440\u043e\u043c \u0432 \u0434\u0430\u043d\u043d\u044b\u0445 \u0443\u0441\u043b\u043e\u0432\u0438\u044f\u0445<\/span><strong>\\\"<\/strong>.<\/p>\", \"type\": \"text-with-image\", \"uuid\": \"5bc3f514-068e-4882-938c-547bd3ac9df2\", \"align\": \"top\", \"image\": \"media\/5861\/images\/32512\/QVba0SwW.jpg\", \"width\": \"150\", \"toggle\": true, \"version\": \"1.0.0\", \"disabled\": false, \"position\": \"right\", \"background\": {\"type\": \"color\", \"style\": \"backgrond-color: #FFFFFF;\", \"value\": \"#FFFFFF\"}}, {\"alt\": \"<p><span>\u0421\u0435\u0440\u0433\u0435\u0435\u0432\u0430 \u0418\u0440\u0438\u043d\u0430 \u042e\u0440\u044c\u0435\u0432\u043d\u0430<\/span><\/p><p>\u0434.\u0442.\u043d., \u043f\u0440\u043e\u0444\u0435\u0441\u0441\u043e\u0440, \u0437\u0430\u0432\u0435\u0434\u0443\u044e\u0449\u0430\u044f \u043a\u0430\u0444\u0435\u0434\u0440\u043e\u0439 \u0442\u0435\u0445\u043d\u043e\u043b\u043e\u0433\u0438\u0438 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u043e\u0432 \u043f\u0438\u0442\u0430\u043d\u0438\u044f \u0438\u0437 \u0440\u0430\u0441\u0442\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0441\u044b\u0440\u044c\u044f \u00ab<span>\u041a\u0435\u043c\u0435\u0440\u043e\u0432\u0441\u043a\u0438\u0439 \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0439 \u0443\u043d\u0438\u0432\u0435\u0440\u0441\u0438\u0442\u0435\u0442<\/span>\u00bb<\/p>\", \"body\": \"<p>\\\"<span>\u0421\u0442\u0440\u0435\u043c\u0438\u0442\u0435\u0441\u044c \u043a <strong>\u0440\u0430\u0437\u043d\u043e\u043e\u0431\u0440\u0430\u0437\u0438\u044e<\/strong> \u043c\u0438\u043d\u0438\u043c\u0430\u043b\u044c\u043d\u043e \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u0430\u043d\u043d\u044b\u0445 \u043f\u0440\u043e\u0434\u0443\u043a\u0442\u043e\u0432, \u0430 <strong>\u043d\u0435 \u043a \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u044e <\/strong>\u0446\u0435\u043b\u044b\u0445 \u0433\u0440\u0443\u043f\u043f. \u0427\u0442\u043e \u044d\u0442\u043e \u0437\u043d\u0430\u0447\u0438\u0442 \u043d\u0430 \u043f\u0440\u0430\u043a\u0442\u0438\u043a\u0435: \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u0439\u0442\u0435, \u0430 \u043d\u0435 \u0443\u0431\u0438\u0440\u0430\u0439\u0442\u0435. \u0414\u043e\u0431\u0430\u0432\u044c\u0442\u0435 \u043e\u0432\u043e\u0449\u0438 \u0438 \u0444\u0440\u0443\u043a\u0442\u044b (\u0434\u043e 400-500 \u0433 \u0432 \u0434\u0435\u043d\u044c), \u0434\u043e\u0431\u0430\u0432\u044c\u0442\u0435 \u0431\u043e\u0431\u043e\u0432\u044b\u0435 (\u0445\u043e\u0442\u044f \u0431\u044b 3-4 \u0440\u0430\u0437\u0430 \u0432 \u043d\u0435\u0434\u0435\u043b\u044e), \u0434\u043e\u0431\u0430\u0432\u044c\u0442\u0435 \u0446\u0435\u043b\u044c\u043d\u044b\u0435 \u0437\u043b\u0430\u043a\u0438 \u0432\u043c\u0435\u0441\u0442\u043e \u0440\u0430\u0444\u0438\u043d\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0445. \u041e\u0433\u0440\u0430\u043d\u0438\u0447\u044c\u0442\u0435 \u0443\u043b\u044c\u0442\u0440\u0430 \u043f\u0435\u0440\u0435\u0440\u0430\u0431\u043e\u0442\u0430\u043d\u043d\u043e\u0435, \u0441\u043b\u0430\u0434\u043a\u0438\u0435 \u043d\u0430\u043f\u0438\u0442\u043a\u0438 \u0438 \u0438\u0437\u0431\u044b\u0442\u043e\u043a \u0441\u043e\u043b\u0438 <\/span>\u2014<span> \u043d\u043e \u043d\u0435 \u043f\u043e\u0442\u043e\u043c\u0443, \u0447\u0442\u043e \u00ab\u044d\u0442\u043e \u0432\u0440\u0435\u0434\u043d\u043e\u00bb, \u0430 \u043f\u043e\u0442\u043e\u043c\u0443, \u0447\u0442\u043e <strong>\u043d\u0430 \u043e\u0441\u0432\u043e\u0431\u043e\u0434\u0438\u0432\u0448\u0435\u0435\u0441\u044f \u043c\u0435\u0441\u0442\u043e \u0434\u043e\u043b\u0436\u043d\u043e \u043f\u0440\u0438\u0439\u0442\u0438 \u0447\u0442\u043e-\u0442\u043e \u043f\u0438\u0442\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0435<\/strong>.<\/span><\/p><p><span>\u0414\u043b\u044f \u041a\u0435\u043c\u0435\u0440\u043e\u0432\u0441\u043a\u043e\u0439 \u043e\u0431\u043b\u0430\u0441\u0442\u0438 \u0441 \u0435\u0435 \u043a\u043b\u0438\u043c\u0430\u0442\u043e\u043c \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e <strong>\u0432\u0430\u0436\u0435\u043d \u0432\u0438\u0442\u0430\u043c\u0438\u043d D<\/strong> <\/span>\u2014<span> \u0435\u0433\u043e \u0434\u0435\u0444\u0438\u0446\u0438\u0442 \u043c\u0430\u0441\u0441\u043e\u0432\u043e \u0440\u0430\u0441\u043f\u0440\u043e\u0441\u0442\u0440\u0430\u043d\u0435\u043d \u0432 \u0440\u0435\u0433\u0438\u043e\u043d\u0430\u0445 \u0441 \u043a\u043e\u0440\u043e\u0442\u043a\u0438\u043c \u0441\u0432\u0435\u0442\u043e\u0432\u044b\u043c \u0434\u043d\u0435\u043c. \u041f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u0443\u0440\u043e\u0432\u043d\u044f 25(OH)D \u0438 \u043a\u043e\u0440\u0440\u0435\u043a\u0446\u0438\u044f \u043f\u043e \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0430\u043c <\/span>\u2014<span> \u043e\u0434\u0438\u043d \u0438\u0437 \u0441\u0430\u043c\u044b\u0445 \u043e\u0431\u043e\u0441\u043d\u043e\u0432\u0430\u043d\u043d\u044b\u0445 \u0448\u0430\u0433\u043e\u0432 \u0434\u043b\u044f \u0437\u0434\u043e\u0440\u043e\u0432\u044c\u044f \u043d\u0430\u0441\u0435\u043b\u0435\u043d\u0438\u044f.<\/span><\/p><p><span>\u0418 \u0433\u043b\u0430\u0432\u043d\u043e\u0435: \u043b\u044e\u0431\u0430\u044f \u0441
